<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>FashionStore SaaS & PWA - Plataforma Comercial Inteligente</title>
    <base href="/" />
    <script>
      (function() {
        var g = typeof globalThis !== 'undefined' ? globalThis : typeof window !== 'undefined' ? window : typeof self !== 'undefined' ? self : this;
        if (!g.crypto) g.crypto = {};
        if (!g.crypto.randomUUID) {
          g.crypto.randomUUID = function() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
              var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
              return v.toString(16);
            });
          };
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="Plataforma SaaS Multitenant de comercio electrónico con soporte PWA Offline, Realidad Aumentada y Analítica Inteligente con IA"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"
    ></script>
  </head>
  <body>
    <app-root></app-root>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js?v=5')
            .then((reg) => {
              reg.update();
              console.log('[PWA] Service Worker registrado exitosamente:', reg.scope);
            })
            .catch((err) => console.log('[PWA] Error al registrar Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
