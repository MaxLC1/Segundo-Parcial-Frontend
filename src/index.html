<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>FashionStore SaaS & PWA - Plataforma Comercial Inteligente</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Plataforma SaaS Multitenant de comercio electrónico con soporte PWA Offline, Realidad Aumentada y Analítica Inteligente con IA" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  </head>
  <body>
    <app-root></app-root>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('[PWA] Service Worker registrado exitosamente:', reg.scope))
            .catch((err) => console.log('[PWA] Error al registrar Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
